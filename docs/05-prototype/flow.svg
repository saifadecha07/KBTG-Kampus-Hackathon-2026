      <rect x="22" y="330" width="256" height="140" rx="14" fill="#FAFCFA"/>
      <text x="34" y="350" font-size="11.5" font-weight="600" fill="#16221B">ขอถอนจากนิรภัย</text>
      <text x="34" y="366" font-size="9" fill="#5C6B62">กดขอถอนแล้วต้องรอ cooldown ก่อนเงิน</text>
      <text x="34" y="378" font-size="9" fill="#5C6B62">จะย้ายเข้ากระเป๋ารายวัน ยกเลิกได้ฟรี</text>
      <rect x="34" y="387" width="232" height="32" rx="8" fill="#F6E7D2"/>
      <text x="150" y="409" font-size="15" font-weight="700" fill="#8A5A1F" text-anchor="middle">00:12</text>
      <rect x="34" y="429" width="232" height="32" rx="10" fill="#17B98F"/>
      <text x="150" y="450" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">ขอถอน 1,000 ฿</text>
      <text x="150" y="464" font-size="7.5" fill="#8A968F" text-anchor="middle">demo: จริงคือ 24 ชม. ย่อให้ดูจบใน 12 วินาที</text>

      <rect x="8" y="500" width="284" height="72" fill="#0D1D1A"/>
      <rect x="31" y="518" width="14" height="14" rx="3" fill="none" stroke="#7C8B85" stroke-width="1.6"/>
      <text x="38" y="544" font-size="7.2" fill="#7C8B85" text-anchor="middle">หน้าหลัก</text>
      <rect x="89" y="518" width="14" height="14" rx="3" fill="none" stroke="#7C8B85" stroke-width="1.6"/>
      <text x="96" y="544" font-size="7.2" fill="#7C8B85" text-anchor="middle">ธุรกรรม</text>
      <circle cx="150" cy="502" r="22" fill="#2FE6B4" stroke="#0D1D1A" stroke-width="4"/>
      <rect x="143" y="495" width="14" height="14" rx="2" fill="none" stroke="#08211B" stroke-width="1.6"/>
      <rect x="203" y="518" width="14" height="14" rx="3" fill="none" stroke="#7C8B85" stroke-width="1.6"/>
      <text x="210" y="544" font-size="7.2" fill="#7C8B85" text-anchor="middle">สแกน</text>
      <rect x="261" y="518" width="14" height="14" rx="3" fill="none" stroke="#2FE6B4" stroke-width="1.6"/>
      <text x="268" y="544" font-size="7.2" fill="#2FE6B4" text-anchor="middle" font-weight="600">อื่นๆ</text>
