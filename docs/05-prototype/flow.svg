  <!-- captions -->
  <text x="170" y="672" font-size="12.5" font-weight="700" fill="#12241C" text-anchor="middle">1 · หน้าหลัก</text>
  <text x="170" y="690" font-size="10" fill="#5C6B62" text-anchor="middle">เห็นบัญชีรายเดือน + กระเป๋ารายวัน/นิรภัยคู่กันตลอด</text>

  <text x="520" y="672" font-size="12.5" font-weight="700" fill="#12241C" text-anchor="middle">2 · เงินเข้า</text>
