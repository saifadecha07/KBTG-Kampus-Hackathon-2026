      <rect x="8" y="500" width="284" height="72" fill="#0D1D1A"/>
      <rect x="31" y="518" width="14" height="14" rx="3" fill="none" stroke="#2FE6B4" stroke-width="1.6"/>
      <text x="38" y="544" font-size="7.2" fill="#2FE6B4" text-anchor="middle" font-weight="600">หน้าหลัก</text>
      <rect x="89" y="518" width="14" height="14" rx="3" fill="none" stroke="#7C8B85" stroke-width="1.6"/>
      <text x="96" y="544" font-size="7.2" fill="#7C8B85" text-anchor="middle">ธุรกรรม</text>
      <circle cx="150" cy="502" r="22" fill="#2FE6B4" stroke="#0D1D1A" stroke-width="4"/>
      <rect x="143" y="495" width="14" height="14" rx="2" fill="none" stroke="#08211B" stroke-width="1.6"/>
      <rect x="203" y="518" width="14" height="14" rx="3" fill="none" stroke="#7C8B85" stroke-width="1.6"/>
      <text x="210" y="544" font-size="7.2" fill="#7C8B85" text-anchor="middle">สแกน</text>
      <rect x="261" y="518" width="14" height="14" rx="3" fill="none" stroke="#7C8B85" stroke-width="1.6"/>
      <text x="268" y="544" font-size="7.2" fill="#7C8B85" text-anchor="middle">อื่นๆ</text>
    </g>
  </g>

  <!-- ================= PHONE 3 : VAULT ================= -->
  <g transform="translate(720,70)">
    <rect x="0" y="0" width="300" height="580" rx="34" fill="#050A09"/>
    <clipPath id="clip3"><rect x="8" y="8" width="284" height="564" rx="26"/></clipPath>
    <g clip-path="url(#clip3)">
      <rect x="8" y="8" width="284" height="564" fill="url(#appbg)"/>

      <text x="24" y="34" font-size="11" fill="#ffffff" opacity="0.75">‹ กลับ</text>
      <text x="24" y="56" font-size="16" font-weight="600" fill="#ffffff">กระเป๋านิรภัย</text>

      <text x="150" y="90" font-size="9.5" fill="#ffffff" opacity="0.6" text-anchor="middle">ยอดสะสมในนิรภัย</text>
      <text x="150" y="118" font-size="24" font-weight="700" fill="#2FE6B4" text-anchor="middle">4,500.00 ฿</text>
      <text x="150" y="136" font-size="9.5" font-weight="600" fill="#F0AA5E" text-anchor="middle">ระยะ: ต้นกล้า</text>

      <rect x="22" y="152" width="256" height="164" rx="16" fill="url(#treebg)"/>
      <ellipse cx="150" cy="288" rx="70" ry="8" fill="#0A1E17"/>
      <rect x="144" y="238" width="12" height="50" rx="4" fill="#8A6A45"/>
      <circle cx="122" cy="245" r="20" fill="#1F9E6E"/>
      <circle cx="178" cy="245" r="20" fill="#1F9E6E"/>
      <circle cx="150" cy="228" r="30" fill="#2FCB8D"/>
      <circle cx="150" cy="199" r="17" fill="#69E3B4"/>
