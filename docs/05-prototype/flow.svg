      <text x="24" y="336" font-size="15" font-weight="600" fill="#16221B">แบ่งเงินตามแผน Pace ไหม?</text>
      <text x="24" y="360" font-size="19" font-weight="700" fill="#0F8C68">22,500.00 ฿</text>
      <line x1="24" y1="370" x2="276" y2="370" stroke="#E4EAE1" stroke-dasharray="3,3"/>
      <text x="24" y="387" font-size="10.5" fill="#33443A">นิรภัย (20%)</text>
      <text x="276" y="387" font-size="10.5" font-weight="600" fill="#33443A" text-anchor="end">+4,500.00 ฿</text>
      <text x="24" y="402" font-size="10.5" fill="#33443A">บัญชีรายเดือน</text>
      <text x="276" y="402" font-size="10.5" font-weight="600" fill="#33443A" text-anchor="end">+18,000.00 ฿</text>
      <text x="24" y="417" font-size="10.5" fill="#33443A">เป้ารายวันแนะนำ</text>
      <text x="276" y="417" font-size="10.5" font-weight="600" fill="#33443A" text-anchor="end">600 ฿/วัน</text>

      <rect x="24" y="429" width="12" height="12" rx="3" fill="#17B98F"/>
