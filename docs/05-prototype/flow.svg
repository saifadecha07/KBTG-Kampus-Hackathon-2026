  <text x="870" y="672" font-size="12.5" font-weight="700" fill="#12241C" text-anchor="middle">3 · กระเป๋านิรภัย</text>
  <text x="870" y="690" font-size="10" fill="#5C6B62" text-anchor="middle">ขอถอนแล้วรอ cooldown เห็นต้นไม้โตตามยอดสะสม</text>
