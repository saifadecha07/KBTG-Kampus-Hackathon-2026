<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 730" font-family="'Noto Sans Thai','Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="appbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132824"/>
      <stop offset="1" stop-color="#0A1614"/>
    </linearGradient>
    <linearGradient id="treebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#153A2E"/>
      <stop offset="1" stop-color="#0E241C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1040" height="730" fill="#F2F4F1"/>

  <text x="20" y="28" font-size="19" font-weight="700" fill="#12241C">Pace ในหน้าตาแบบ K PLUS — Concept Mockup</text>
  <text x="20" y="48" font-size="11.5" fill="#5C6B62">โทนสีและองค์ประกอบอ้างอิงจากภาพตัวอย่างแอปบน App Store ของ K PLUS จริง (มืด/เขียวมิ้นท์) — ทีมออกแบบเองเพื่อใช้ประกอบ pitch ไม่ใช่ภาพหน้าจอจริงของแอป</text>

  <!-- connector arrows -->
  <path d="M325,360 L362,360" stroke="#C3CDC6" stroke-width="3" fill="none"/>
  <path d="M360,351 L374,360 L360,369 Z" fill="#C3CDC6"/>
  <path d="M675,360 L712,360" stroke="#C3CDC6" stroke-width="3" fill="none"/>
  <path d="M710,351 L724,360 L710,369 Z" fill="#C3CDC6"/>

  <!-- ================= PHONE 1 : HOME ================= -->
  <g transform="translate(20,70)">
    <rect x="0" y="0" width="300" height="580" rx="34" fill="#050A09"/>
    <clipPath id="clip1"><rect x="8" y="8" width="284" height="564" rx="26"/></clipPath>
    <g clip-path="url(#clip1)">
      <rect x="8" y="8" width="284" height="564" fill="url(#appbg)"/>

      <text x="24" y="34" font-size="11" fill="#ffffff" opacity="0.75">สวัสดี, พลอย</text>
      <text x="24" y="56" font-size="16" font-weight="600" fill="#ffffff">หน้าหลัก</text>
      <rect x="216" y="40" width="60" height="18" rx="9" fill="none" stroke="#2FE6B4" stroke-width="1.3"/>
      <text x="246" y="53" font-size="8.3" font-weight="700" fill="#2FE6B4" text-anchor="middle">PACE ON</text>

      <text x="24" y="92" font-size="9.5" fill="#ffffff" opacity="0.65">บัญชีเงินรายเดือน (พร้อมใช้ หลังกันบิลแล้ว)</text>
      <text x="24" y="122" font-size="26" font-weight="700" fill="#2FE6B4">18,000.00 ฿</text>
      <text x="24" y="140" font-size="8.7" fill="#ffffff" opacity="0.55">กันบิลไว้แล้ว 3,200 ฿ · เหลือ 21 วันจนเงินเข้ารอบหน้า</text>

      <rect x="22" y="160" width="256" height="66" rx="14" fill="#FAFCFA"/>
      <text x="34" y="180" font-size="10.5" font-weight="600" fill="#16221B">กระเป๋าใช้จ่ายรายวัน</text>
      <text x="244" y="180" font-size="12.5" font-weight="600" fill="#0F8C68" text-anchor="end">320.00 ฿</text>
      <rect x="34" y="190" width="232" height="6" rx="3" fill="#E3EEE9"/>
      <rect x="34" y="190" width="123" height="6" rx="3" fill="#17B98F"/>
      <text x="34" y="211" font-size="8.5" fill="#5C6B62">เป้าวันนี้ 600 ฿ · เติมอัตโนมัติทุกเที่ยงคืน</text>

      <rect x="22" y="238" width="256" height="66" rx="14" fill="#FAFCFA"/>
      <text x="34" y="258" font-size="10.5" font-weight="600" fill="#16221B">กระเป๋านิรภัย</text>
      <text x="244" y="258" font-size="12.5" font-weight="600" fill="#16221B" text-anchor="end">4,500.00 ฿</text>
      <rect x="34" y="268" width="128" height="17" rx="8.5" fill="#F6E7D2"/>
      <text x="42" y="280" font-size="8" fill="#8A5A1F">🌱 ต้นกล้ากำลังโต</text>

      <text x="22" y="332" font-size="8.7" fill="#ffffff" opacity="0.4" letter-spacing="0.06em">บริการเพิ่มเติม</text>
      <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4">
        <circle cx="46" cy="366" r="20"/>
        <circle cx="112" cy="366" r="20"/>
        <circle cx="178" cy="366" r="20"/>
        <circle cx="244" cy="366" r="20"/>
      </g>
      <text x="46" y="372" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.8">↗</text>
      <text x="112" y="372" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.8">฿</text>
      <text x="178" y="372" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.8">▤</text>
      <text x="244" y="372" font-size="11" fill="#ffffff" text-anchor="middle" opacity="0.8">◫</text>
      <text x="46" y="398" font-size="7.3" fill="#ffffff" opacity="0.5" text-anchor="middle">โอนเงิน</text>
      <text x="112" y="398" font-size="7.3" fill="#ffffff" opacity="0.5" text-anchor="middle">เติมเงิน</text>
      <text x="178" y="398" font-size="7.3" fill="#ffffff" opacity="0.5" text-anchor="middle">จ่ายบิล</text>
      <text x="244" y="398" font-size="7.3" fill="#ffffff" opacity="0.5" text-anchor="middle">Statement</text>

      <rect x="8" y="500" width="284" height="72" fill="#0D1D1A"/>
      <rect x="31" y="518" width="14" height="14" rx="3" fill="none" stroke="#2FE6B4" stroke-width="1.6"/>
      <text x="38" y="544" font-size="7.2" fill="#2FE6B4" text-anchor="middle" font-weight="600">หน้าหลัก</text>
      <rect x="89" y="518" width="14" height="14" rx="3" fill="none" stroke="#7C8B85" stroke-width="1.6"/>
      <text x="96" y="544" font-size="7.2" fill="#7C8B85" text-anchor="middle">ธุรกรรม</text>
      <circle cx="150" cy="502" r="22" fill="#2FE6B4" stroke="#0D1D1A" stroke-width="4"/>
      <rect x="143" y="495" width="14" height="14" rx="2" fill="none" stroke="#08211B" stroke-width="1.6"/>
      <rect x="203" y="518" width="14" height="14" rx="3" fill="none" stroke="#7C8B85" stroke-width="1.6"/>
      <text x="210" y="544" font-size="7.2" fill="#7C8B85" text-anchor="middle">สแกน</text>
      <rect x="261" y="518" width="14" height="14" rx="3" fill="none" stroke="#7C8B85" stroke-width="1.6"/>
      <text x="268" y="544" font-size="7.2" fill="#7C8B85" text-anchor="middle">อื่นๆ</text>
    </g>
  </g>

  <!-- ================= PHONE 2 : INCOME CONFIRM ================= -->
  <g transform="translate(370,70)">
    <rect x="0" y="0" width="300" height="580" rx="34" fill="#050A09"/>
    <clipPath id="clip2"><rect x="8" y="8" width="284" height="564" rx="26"/></clipPath>
    <g clip-path="url(#clip2)">
      <rect x="8" y="8" width="284" height="564" fill="url(#appbg)"/>
      <text x="24" y="34" font-size="11" fill="#ffffff" opacity="0.75">สวัสดี, พลอย</text>
      <text x="24" y="56" font-size="16" font-weight="600" fill="#ffffff">หน้าหลัก</text>
      <text x="24" y="122" font-size="26" font-weight="700" fill="#2FE6B4" opacity="0.35">— ฿</text>

