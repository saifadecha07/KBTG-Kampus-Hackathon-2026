<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1546 928" font-family="'Noto Sans Thai','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="1546" height="928" fill="#F2F4F1"/>
  <text x="773" y="36" font-size="19" font-weight="700" fill="#12241C" text-anchor="middle">Pace — Logic Flow ของ 3 กลไกหลัก</text>
  <text x="773" y="60" font-size="11" fill="#5C6B62" text-anchor="middle">เส้นประด้านข้าง = แขนงทางเลือก (branch) · กล่องเขียว = ทำสำเร็จ/automation · กล่องเหลือง = จุดตัดสินใจ · กล่องชมพูอ่อน = ทางออกแขนง</text>
  <line x1="40" y1="80" x2="1506" y2="80" stroke="#DCE3DE" stroke-width="1"/>
<text x="190" y="90" font-size="14.5" font-weight="700" fill="#12241C" text-anchor="middle">1. Auto-Split — เงินเข้า</text><rect x="40" y="175" width="300" height="46" rx="23" fill="#0D1D1A"/><text x="190" y="202" font-size="10.3" font-weight="700" fill="#FFFFFF" text-anchor="middle">เงินเข้าบัญชี</text><path d="M190,221 L190,239" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,233 L190,247 L195,233 Z" fill="#9AA69F"/><polygon points="190,247 334,282 190,317 46,282" fill="#F6E7D2"/><text x="190" y="286" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">เกินยอดที่ตั้งไว้ไหม?</text><path d="M340,282 L350,282" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M344,278 L352,282 L344,286 Z" fill="#C79B95"/><text x="344" y="276" font-size="8" font-weight="700" fill="#C79B95">ไม่เกิน</text><rect x="356" y="253" width="150" height="58" rx="10" fill="#F2E3E1"/><text x="431" y="273" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ไม่ทำอะไร</text>
      <text x="431" y="285" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">(กันเผลอแบ่งเงินก้อนเล็ก</text>
      <text x="431" y="297" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">เช่น เพื่อนโอนคืน)</text><path d="M190,317 L190,335" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,329 L190,343 L195,329 Z" fill="#9AA69F"/><rect x="40" y="343" width="300" height="52" rx="12" fill="#FAFCFA" stroke="#D8E0DA" stroke-width="1"/><text x="190" y="366.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">เด้งถาม "แบ่งเงินก้อนนี้</text>
      <text x="190" y="379.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">ตามแผน Pace ไหม?"</text><path d="M190,395 L190,413" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,407 L190,421 L195,407 Z" fill="#9AA69F"/><polygon points="190,421 334,457 190,493 46,457" fill="#F6E7D2"/><text x="190" y="454.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">ผู้ใช้กด "แบ่งเลย"</text>
      <text x="190" y="467.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">ไหม?</text><path d="M340,457 L350,457" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M344,453 L352,457 L344,461 Z" fill="#C79B95"/><text x="344" y="451" font-size="8" font-weight="700" fill="#C79B95">ไม่ใช่ตอนนี้</text><rect x="356" y="428" width="150" height="58" rx="10" fill="#F2E3E1"/><text x="431" y="448" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ไม่แบ่ง + Vault Streak</text>
      <text x="431" y="460" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">รีเซ็ตเป็น 0</text>
      <text x="431" y="472" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">(Decision R22)</text><path d="M190,493 L190,511" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,505 L190,519 L195,505 Z" fill="#9AA69F"/><rect x="40" y="519" width="300" height="52" rx="12" fill="#17B98F"/><text x="190" y="542.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">Split ทันที: กันบิลไว้ก่อน</text>
      <text x="190" y="555.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">→ นิรภัย → รายวัน</text><path d="M190,571 L190,589" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,583 L190,597 L195,583 Z" fill="#9AA69F"/><polygon points="190,597 334,632 190,667 46,632" fill="#F6E7D2"/><text x="190" y="636" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">ติ๊ก "จำไว้" ไหม?</text><path d="M340,632 L350,632" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M344,628 L352,632 L344,636 Z" fill="#C79B95"/><text x="344" y="626" font-size="8" font-weight="700" fill="#C79B95">ไม่ติ๊ก</text><rect x="356" y="603" width="150" height="58" rx="10" fill="#F2E3E1"/><text x="431" y="623" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">รอบเงินเข้าถัดไป</text>
      <text x="431" y="635" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ระบบเด้งถามใหม่</text>
      <text x="431" y="647" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">อีกครั้ง</text><path d="M190,667 L190,685" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,679 L190,693 L195,679 Z" fill="#9AA69F"/><rect x="40" y="693" width="300" height="65" rx="12" fill="#17B98F"/><text x="190" y="716.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">จำผู้ส่งรายนี้ไว้ —</text>
      <text x="190" y="729.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">รอบถัดไปอัตโนมัติ</text>
      <text x="190" y="742.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">เต็มรูปแบบ ไม่เด้งถามอีก</text><path d="M190,758 L190,776" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,770 L190,784 L195,770 Z" fill="#9AA69F"/><rect x="40" y="784" width="300" height="65" rx="12" fill="#E7EEEC"/><text x="190" y="807.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">Vault Streak +1</text>
      <text x="190" y="820.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">(นับเป็น "รอบ" ไม่ใช่นับวัน —</text>
      <text x="190" y="833.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">ฟรีแลนซ์ก็นับได้เท่ากัน)</text>
<text x="680" y="90" font-size="14.5" font-weight="700" fill="#12241C" text-anchor="middle">2. Daily Auto-Refill — ใช้จ่ายรายวัน</text><rect x="530" y="175" width="300" height="52" rx="26" fill="#0D1D1A"/><text x="680" y="198.5" font-size="10.3" font-weight="700" fill="#FFFFFF" text-anchor="middle">เที่ยงคืนทุกวัน (cron)</text>
      <text x="680" y="211.5" font-size="10.3" font-weight="700" fill="#FFFFFF" text-anchor="middle">และทุกครั้งที่ผู้ใช้จ่ายเงิน</text><path d="M680,227 L680,245" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,239 L680,253 L685,239 Z" fill="#9AA69F"/><polygon points="680,253 824,289 680,325 536,289" fill="#F6E7D2"/><text x="680" y="286.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">กระเป๋ารายวัน ไม่พอ</text>
      <text x="680" y="299.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">(&lt; เป้า หรือ &lt; ยอดที่จะจ่าย)?</text><path d="M830,289 L840,289" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M834,285 L842,289 L834,293 Z" fill="#C79B95"/><text x="834" y="283" font-size="8" font-weight="700" fill="#C79B95">พออยู่แล้ว</text><rect x="846" y="260" width="150" height="58" rx="10" fill="#F2E3E1"/><text x="921" y="280" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ไม่ทำอะไร —</text>
      <text x="921" y="292" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">เงินเหลือเมื่อวาน</text>
      <text x="921" y="304" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">สะสมต่อ (carry-over)</text><path d="M680,325 L680,343" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,337 L680,351 L685,337 Z" fill="#9AA69F"/><rect x="530" y="351" width="300" height="65" rx="12" fill="#FAFCFA" stroke="#D8E0DA" stroke-width="1"/><text x="680" y="374.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">ดึงส่วนต่าง/ส่วนขาด</text>
      <text x="680" y="387.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">จากบัญชีรายเดือนมาเติมก่อน</text>
      <text x="680" y="400.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">(real-time, atomic)</text><path d="M680,416 L680,434" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,428 L680,442 L685,428 Z" fill="#9AA69F"/><rect x="530" y="442" width="300" height="65" rx="12" fill="#FAFCFA" stroke="#D8E0DA" stroke-width="1"/><text x="680" y="465.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">ตัดเงินซื้อจากกระเป๋ารายวัน</text>
      <text x="680" y="478.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">เสมอ — ไม่สลับไปหัก</text>
      <text x="680" y="491.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">รายเดือนตรงๆ</text><path d="M680,507 L680,525" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,519 L680,533 L685,519 Z" fill="#9AA69F"/><polygon points="680,533 824,569 680,605 536,569" fill="#F6E7D2"/><text x="680" y="566.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">วันนี้ใช้เกิน</text>
      <text x="680" y="579.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">เป้ารายวันไหม?</text><path d="M830,569 L840,569" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M834,565 L842,569 L834,573 Z" fill="#C79B95"/><text x="834" y="563" font-size="8" font-weight="700" fill="#C79B95">ไม่เกิน</text><rect x="846" y="546" width="150" height="46" rx="10" fill="#F2E3E1"/><text x="921" y="566" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">จบเงียบๆ</text>
      <text x="921" y="578" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ไม่มี warning</text><path d="M680,605 L680,623" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,617 L680,631 L685,617 Z" fill="#9AA69F"/><rect x="530" y="631" width="300" height="65" rx="12" fill="#FAFCFA" stroke="#D8E0DA" stroke-width="1"/><text x="680" y="654.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">ขึ้น warning ทันที +</text>
      <text x="680" y="667.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">บันทึกสถิติสะสม +</text>
      <text x="680" y="680.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">โชว์ยอดรายเดือนคงเหลือหลังหัก</text><path d="M680,696 L680,714" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,708 L680,722 L685,708 Z" fill="#9AA69F"/><rect x="530" y="722" width="300" height="65" rx="12" fill="#E7EEEC"/><text x="680" y="745.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">ตัวเลข "เกินเป้าไปแล้ว</text>
      <text x="680" y="758.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">X บาท" ค้างแสดงทั้งวัน</text>
      <text x="680" y="771.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">รีเซ็ตเที่ยงคืนพร้อมรอบใหม่</text><path d="M680,787 L680,805" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,799 L680,813 L685,799 Z" fill="#9AA69F"/><rect x="530" y="813" width="300" height="65" rx="12" fill="#E7EEEC"/><text x="680" y="836.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">ถ้าบัญชีรายเดือนหมดจริง →</text>
      <text x="680" y="849.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">ปฏิเสธธุรกรรม</text>
      <text x="680" y="862.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">(ไม่ crash ไม่เงียบ)</text>
<text x="1170" y="90" font-size="14.5" font-weight="700" fill="#12241C" text-anchor="middle">3. กระเป๋านิรภัย — Cooldown</text><rect x="1020" y="175" width="300" height="65" rx="32.5" fill="#0D1D1A"/><text x="1170" y="198.5" font-size="10.3" font-weight="700" fill="#FFFFFF" text-anchor="middle">เงินเข้านิรภัยจาก</text>
      <text x="1170" y="211.5" font-size="10.3" font-weight="700" fill="#FFFFFF" text-anchor="middle">auto-split — เข้าทันที</text>
      <text x="1170" y="224.5" font-size="10.3" font-weight="700" fill="#FFFFFF" text-anchor="middle">ไม่มี delay</text><path d="M1170,240 L1170,258" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M1165,252 L1170,266 L1175,252 Z" fill="#9AA69F"/><rect x="1020" y="266" width="300" height="52" rx="12" fill="#FAFCFA" stroke="#D8E0DA" stroke-width="1"/><text x="1170" y="289.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">ผู้ใช้กดขอถอน</text>
      <text x="1170" y="302.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">(จำนวนเท่าไหร่ก็ได้)</text><path d="M1170,318 L1170,336" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M1165,330 L1170,344 L1175,330 Z" fill="#9AA69F"/><rect x="1020" y="344" width="300" height="78" rx="12" fill="#FAFCFA" stroke="#D8E0DA" stroke-width="1"/><text x="1170" y="367.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">สร้างคำขอ "pending" +</text>
      <text x="1170" y="380.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">เริ่มจับเวลา cooldown</text>
      <text x="1170" y="393.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">24–48 ชม.</text>
      <text x="1170" y="406.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">(คำนวณที่ server เท่านั้น)</text><path d="M1170,422 L1170,440" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M1165,434 L1170,448 L1175,434 Z" fill="#9AA69F"/><polygon points="1170,448 1314,484 1170,520 1026,484" fill="#F6E7D2"/><text x="1170" y="481.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">ขอถอนซ้ำระหว่างมีคำขอ</text>
      <text x="1170" y="494.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">pending อยู่?</text><path d="M1320,484 L1330,484" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M1324,480 L1332,484 L1324,488 Z" fill="#C79B95"/><text x="1324" y="478" font-size="8" font-weight="700" fill="#C79B95">มี</text><rect x="1336" y="455" width="150" height="58" rx="10" fill="#F2E3E1"/><text x="1411" y="475" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">รวมเป็นคำขอเดียว</text>
      <text x="1411" y="487" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">นับเวลาคูลดาวน์ใหม่</text>
      <text x="1411" y="499" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">จากคำขอล่าสุด</text><path d="M1170,520 L1170,538" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M1165,532 L1170,546 L1175,532 Z" fill="#9AA69F"/><polygon points="1170,546 1314,582 1170,618 1026,582" fill="#F6E7D2"/><text x="1170" y="579.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">กดยกเลิก</text>
      <text x="1170" y="592.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">ก่อนครบเวลาไหม?</text><path d="M1320,582 L1330,582" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M1324,578 L1332,582 L1324,586 Z" fill="#C79B95"/><text x="1324" y="576" font-size="8" font-weight="700" fill="#C79B95">ยกเลิก</text><rect x="1336" y="553" width="150" height="58" rx="10" fill="#F2E3E1"/><text x="1411" y="573" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">เงินอยู่นิรภัยต่อ</text>
      <text x="1411" y="585" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ไม่มีบทลงโทษ/</text>
      <text x="1411" y="597" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ค่าปรับใดๆ</text><path d="M1170,618 L1170,636" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M1165,630 L1170,644 L1175,630 Z" fill="#9AA69F"/><rect x="1020" y="644" width="300" height="65" rx="12" fill="#17B98F"/><text x="1170" y="667.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">ครบเวลา →</text>
      <text x="1170" y="680.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">ย้ายเงินเข้ากระเป๋ารายวัน</text>
      <text x="1170" y="693.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">ให้อัตโนมัติ ไม่ต้องกดซ้ำ</text><path d="M1170,709 L1170,727" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M1165,721 L1170,735 L1175,721 Z" fill="#9AA69F"/><rect x="1020" y="735" width="300" height="78" rx="12" fill="#E7EEEC"/><text x="1170" y="758.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">Vault Streak "ไม่เปลี่ยน"</text>
      <text x="1170" y="771.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">จากการถอนนี้ — streak</text>
      <text x="1170" y="784.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">นับจากฝั่ง Auto-Split</text>
      <text x="1170" y="797.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">เท่านั้น (Decision R22)</text>

</svg>
