<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1546 980" font-family="'Noto Sans Thai','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="1546" height="980" fill="#F2F4F1"/>
  <text x="773" y="36" font-size="19" font-weight="700" fill="#12241C" text-anchor="middle">Pace — Logic Flow ของ 3 กลไกหลัก</text>
  <text x="773" y="60" font-size="11" fill="#5C6B62" text-anchor="middle">เส้นประด้านข้าง = แขนงทางเลือก (branch) · กล่องเขียว = ทำสำเร็จ/automation · กล่องเหลือง = จุดตัดสินใจ · กล่องชมพูอ่อน = ทางออกแขนง</text>
  <line x1="40" y1="80" x2="1506" y2="80" stroke="#DCE3DE" stroke-width="1"/>
<text x="190" y="90" font-size="14.5" font-weight="700" fill="#12241C" text-anchor="middle">① Auto-Split — เงินเข้า</text><rect x="40" y="175" width="300" height="46" rx="23" fill="#0D1D1A"/><text x="190" y="202" font-size="10.3" font-weight="700" fill="#FFFFFF" text-anchor="middle">เงินเข้าบัญชี</text><path d="M190,221 L190,239" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,233 L190,247 L195,233 Z" fill="#9AA69F"/><polygon points="190,247 334,282 190,317 46,282" fill="#F6E7D2"/><text x="190" y="286" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">เกินยอดที่ตั้งไว้ไหม?</text><path d="M340,282 L350,282" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M344,278 L352,282 L344,286 Z" fill="#C79B95"/><text x="344" y="276" font-size="8" font-weight="700" fill="#C79B95">ไม่เกิน</text><rect x="356" y="253" width="150" height="58" rx="10" fill="#F2E3E1"/><text x="431" y="273" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ไม่ทำอะไร</text>
      <text x="431" y="285" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">(กันเผลอแบ่งเงินก้อนเล</text>
      <text x="431" y="297" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">็ก เช่น เพื่อนโอนคืน)</text><path d="M190,317 L190,335" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,329 L190,343 L195,329 Z" fill="#9AA69F"/><rect x="40" y="343" width="300" height="52" rx="12" fill="#FAFCFA" stroke="#D8E0DA" stroke-width="1"/><text x="190" y="366.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">เด้งถาม "แบ่งเงินก้อนนี้ตา</text>
      <text x="190" y="379.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">มแผน Pace ไหม?"</text><path d="M190,395 L190,413" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,407 L190,421 L195,407 Z" fill="#9AA69F"/><polygon points="190,421 334,457 190,493 46,457" fill="#F6E7D2"/><text x="190" y="454.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">ผู้ใช้กด "แบ่งเลย"</text>
      <text x="190" y="467.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">ไหม?</text><path d="M340,457 L350,457" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M344,453 L352,457 L344,461 Z" fill="#C79B95"/><text x="344" y="451" font-size="8" font-weight="700" fill="#C79B95">ไม่ใช่ตอนนี้</text><rect x="356" y="428" width="150" height="58" rx="10" fill="#F2E3E1"/><text x="431" y="448" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ไม่แบ่ง + Vault Streak</text>
      <text x="431" y="460" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">รีเซ็ตเป็น 0 (Decision</text>
      <text x="431" y="472" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">R22)</text><path d="M190,493 L190,511" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,505 L190,519 L195,505 Z" fill="#9AA69F"/><rect x="40" y="519" width="300" height="52" rx="12" fill="#17B98F"/><text x="190" y="542.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">Split ทันที: กันบิลไว้ก่อน</text>
      <text x="190" y="555.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">→ นิรภัย → รายวัน</text><path d="M190,571 L190,589" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,583 L190,597 L195,583 Z" fill="#9AA69F"/><polygon points="190,597 334,632 190,667 46,632" fill="#F6E7D2"/><text x="190" y="636" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">ติ๊ก "จำไว้" ไหม?</text><path d="M340,632 L350,632" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M344,628 L352,632 L344,636 Z" fill="#C79B95"/><text x="344" y="626" font-size="8" font-weight="700" fill="#C79B95">ไม่ติ๊ก</text><rect x="356" y="603" width="150" height="58" rx="10" fill="#F2E3E1"/><text x="431" y="623" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">รอบเงินเข้าถัดไป</text>
      <text x="431" y="635" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ระบบเด้งถามใหม่อีกครั้</text>
      <text x="431" y="647" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ง</text><path d="M190,667 L190,685" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,679 L190,693 L195,679 Z" fill="#9AA69F"/><rect x="40" y="693" width="300" height="65" rx="12" fill="#17B98F"/><text x="190" y="716.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">จำผู้ส่งรายนี้ไว้ —</text>
      <text x="190" y="729.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">รอบถัดไปอัตโนมัติเต็มรูปแบ</text>
      <text x="190" y="742.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">บ ไม่เด้งถามอีก</text><path d="M190,758 L190,776" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M185,770 L190,784 L195,770 Z" fill="#9AA69F"/><rect x="40" y="784" width="300" height="65" rx="12" fill="#E7EEEC"/><text x="190" y="807.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">Vault Streak +1 (นับเป็น</text>
      <text x="190" y="820.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">"รอบ" ไม่ใช่นับวัน —</text>
      <text x="190" y="833.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">ฟรีแลนซ์ก็นับได้เท่ากัน)</text>
<text x="680" y="90" font-size="14.5" font-weight="700" fill="#12241C" text-anchor="middle">② Daily Auto-Refill — ใช้จ่ายรายวัน</text><rect x="530" y="175" width="300" height="65" rx="32.5" fill="#0D1D1A"/><text x="680" y="198.5" font-size="10.3" font-weight="700" fill="#FFFFFF" text-anchor="middle">เที่ยงคืนทุกวัน (cron)</text>
      <text x="680" y="211.5" font-size="10.3" font-weight="700" fill="#FFFFFF" text-anchor="middle">และทุกครั้งที่ผู้ใช้จ่ายเง</text>
      <text x="680" y="224.5" font-size="10.3" font-weight="700" fill="#FFFFFF" text-anchor="middle">ิน</text><path d="M680,240 L680,258" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,252 L680,266 L685,252 Z" fill="#9AA69F"/><polygon points="680,266 824,308.5 680,351 536,308.5" fill="#F6E7D2"/><text x="680" y="299.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">กระเป๋ารายวัน ไม่พอ (&lt;</text>
      <text x="680" y="312.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">เป้า หรือ &lt;</text>
      <text x="680" y="325.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">ยอดที่จะจ่าย)?</text><path d="M830,308.5 L840,308.5" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M834,304.5 L842,308.5 L834,312.5 Z" fill="#C79B95"/><text x="834" y="302.5" font-size="8" font-weight="700" fill="#C79B95">พออยู่แล้ว</text><rect x="846" y="279.5" width="150" height="58" rx="10" fill="#F2E3E1"/><text x="921" y="299.5" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ไม่ทำอะไร —</text>
      <text x="921" y="311.5" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">เงินเหลือเมื่อวานสะสมต</text>
      <text x="921" y="323.5" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">่อ (carry-over)</text><path d="M680,351 L680,369" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,363 L680,377 L685,363 Z" fill="#9AA69F"/><rect x="530" y="377" width="300" height="65" rx="12" fill="#FAFCFA" stroke="#D8E0DA" stroke-width="1"/><text x="680" y="400.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">ดึงส่วนต่าง/ส่วนขาดจากบัญช</text>
      <text x="680" y="413.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">ีรายเดือนมาเติมก่อน</text>
      <text x="680" y="426.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">(real-time, atomic)</text><path d="M680,442 L680,460" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,454 L680,468 L685,454 Z" fill="#9AA69F"/><rect x="530" y="468" width="300" height="65" rx="12" fill="#FAFCFA" stroke="#D8E0DA" stroke-width="1"/><text x="680" y="491.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">ตัดเงินซื้อจากกระเป๋ารายวั</text>
      <text x="680" y="504.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">นเสมอ — ไม่สลับไปหักรายเดื</text>
      <text x="680" y="517.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">อนตรงๆ</text><path d="M680,533 L680,551" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,545 L680,559 L685,545 Z" fill="#9AA69F"/><polygon points="680,559 824,595 680,631 536,595" fill="#F6E7D2"/><text x="680" y="592.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">วันนี้ใช้เกินเป้ารายวั</text>
      <text x="680" y="605.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">นไหม?</text><path d="M830,595 L840,595" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M834,591 L842,595 L834,599 Z" fill="#C79B95"/><text x="834" y="589" font-size="8" font-weight="700" fill="#C79B95">ไม่เกิน</text><rect x="846" y="573" width="150" height="44" rx="10" fill="#F2E3E1"/><text x="921" y="598" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">จบเงียบๆ ไม่มี warning</text><path d="M680,631 L680,649" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,643 L680,657 L685,643 Z" fill="#9AA69F"/><rect x="530" y="657" width="300" height="78" rx="12" fill="#FAFCFA" stroke="#D8E0DA" stroke-width="1"/><text x="680" y="680.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">ขึ้น warning ทันที +</text>
      <text x="680" y="693.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">บันทึกสถิติสะสม +</text>
      <text x="680" y="706.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">โชว์ยอดรายเดือนคงเหลือหลัง</text>
      <text x="680" y="719.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">หัก</text><path d="M680,735 L680,753" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,747 L680,761 L685,747 Z" fill="#9AA69F"/><rect x="530" y="761" width="300" height="78" rx="12" fill="#E7EEEC"/><text x="680" y="784.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">ตัวเลข "เกินเป้าไปแล้ว X</text>
      <text x="680" y="797.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">บาท" ค้างแสดงทั้งวัน</text>
      <text x="680" y="810.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">รีเซ็ตเที่ยงคืนพร้อมรอบใหม</text>
      <text x="680" y="823.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">่</text><path d="M680,839 L680,857" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M675,851 L680,865 L685,851 Z" fill="#9AA69F"/><rect x="530" y="865" width="300" height="65" rx="12" fill="#E7EEEC"/><text x="680" y="888.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">ถ้าบัญชีรายเดือนหมดจริง →</text>
      <text x="680" y="901.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">ปฏิเสธธุรกรรม (ไม่ crash</text>
      <text x="680" y="914.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">ไม่เงียบ)</text>
<text x="1170" y="90" font-size="14.5" font-weight="700" fill="#12241C" text-anchor="middle">③ กระเป๋านิรภัย — Cooldown</text><rect x="1020" y="175" width="300" height="65" rx="32.5" fill="#0D1D1A"/><text x="1170" y="198.5" font-size="10.3" font-weight="700" fill="#FFFFFF" text-anchor="middle">เงินเข้านิรภัยจาก</text>
      <text x="1170" y="211.5" font-size="10.3" font-weight="700" fill="#FFFFFF" text-anchor="middle">auto-split — เข้าทันที</text>
      <text x="1170" y="224.5" font-size="10.3" font-weight="700" fill="#FFFFFF" text-anchor="middle">ไม่มี delay</text><path d="M1170,240 L1170,258" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M1165,252 L1170,266 L1175,252 Z" fill="#9AA69F"/><rect x="1020" y="266" width="300" height="52" rx="12" fill="#FAFCFA" stroke="#D8E0DA" stroke-width="1"/><text x="1170" y="289.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">ผู้ใช้กดขอถอน</text>
      <text x="1170" y="302.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">(จำนวนเท่าไหร่ก็ได้)</text><path d="M1170,318 L1170,336" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M1165,330 L1170,344 L1175,330 Z" fill="#9AA69F"/><rect x="1020" y="344" width="300" height="78" rx="12" fill="#FAFCFA" stroke="#D8E0DA" stroke-width="1"/><text x="1170" y="367.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">สร้างคำขอ "pending" +</text>
      <text x="1170" y="380.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">เริ่มจับเวลา cooldown</text>
      <text x="1170" y="393.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">24–48 ชม. (คำนวณที่ server</text>
      <text x="1170" y="406.5" font-size="10.3" font-weight="600" fill="#16221B" text-anchor="middle">เท่านั้น)</text><path d="M1170,422 L1170,440" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M1165,434 L1170,448 L1175,434 Z" fill="#9AA69F"/><polygon points="1170,448 1314,484 1170,520 1026,484" fill="#F6E7D2"/><text x="1170" y="481.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">ขอถอนซ้ำระหว่างมีคำขอ</text>
      <text x="1170" y="494.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">pending อยู่?</text><path d="M1320,484 L1330,484" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M1324,480 L1332,484 L1324,488 Z" fill="#C79B95"/><text x="1324" y="478" font-size="8" font-weight="700" fill="#C79B95">มี</text><rect x="1336" y="455" width="150" height="58" rx="10" fill="#F2E3E1"/><text x="1411" y="475" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">รวมเป็นคำขอเดียว</text>
      <text x="1411" y="487" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">นับเวลาคูลดาวน์ใหม่จาก</text>
      <text x="1411" y="499" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">คำขอล่าสุด</text><path d="M1170,520 L1170,538" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M1165,532 L1170,546 L1175,532 Z" fill="#9AA69F"/><polygon points="1170,546 1314,582 1170,618 1026,582" fill="#F6E7D2"/><text x="1170" y="579.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">กดยกเลิกก่อนครบเวลาไหม</text>
      <text x="1170" y="592.5" font-size="9.8" font-weight="600" fill="#8A5A1F" text-anchor="middle">?</text><path d="M1320,582 L1330,582" stroke="#C79B95" stroke-width="1.6" fill="none" stroke-dasharray="3,3"/><path d="M1324,578 L1332,582 L1324,586 Z" fill="#C79B95"/><text x="1324" y="576" font-size="8" font-weight="700" fill="#C79B95">ยกเลิก</text><rect x="1336" y="553" width="150" height="58" rx="10" fill="#F2E3E1"/><text x="1411" y="573" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">เงินอยู่นิรภัยต่อ</text>
      <text x="1411" y="585" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ไม่มีบทลงโทษ/ค่าปรับใด</text>
      <text x="1411" y="597" font-size="8.3" font-weight="600" fill="#8A3A32" text-anchor="middle">ๆ</text><path d="M1170,618 L1170,636" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M1165,630 L1170,644 L1175,630 Z" fill="#9AA69F"/><rect x="1020" y="644" width="300" height="65" rx="12" fill="#17B98F"/><text x="1170" y="667.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">ครบเวลา → ย้ายเงินเข้ากระเ</text>
      <text x="1170" y="680.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">ป๋ารายวันให้อัตโนมัติ</text>
      <text x="1170" y="693.5" font-size="10.3" font-weight="600" fill="#FFFFFF" text-anchor="middle">ไม่ต้องกดซ้ำ</text><path d="M1170,709 L1170,727" stroke="#9AA69F" stroke-width="2" fill="none"/><path d="M1165,721 L1170,735 L1175,721 Z" fill="#9AA69F"/><rect x="1020" y="735" width="300" height="78" rx="12" fill="#E7EEEC"/><text x="1170" y="758.5" font-size="10.3" font-weight="600" fill="#3A4A43" text-anchor="middle">Vault Streak "ไม่เปลี่ยน"</text>
